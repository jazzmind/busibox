## Python project configuration for the rebuilt agent server
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-server"
version = "0.1.0"
description = "FastAPI + Pydantic AI agent server for Busibox"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.5,<1",
  "uvicorn>=0.32.0,<1",
  "pydantic>=2.11.0,<3",
  "pydantic-settings>=2.6.0,<3",
  "pydantic-ai-slim[openai]>=1.88.0,<2",
  "httpx>=0.27.2,<1",
  "sqlalchemy>=2.0.35,<3",
  "asyncpg>=0.29.0,<1",
  "alembic>=1.13.2,<2",
  "python-jose[cryptography]>=3.3.0,<4",
  "redis>=5.0.8,<6",
  "apscheduler>=3.10.4,<4",
  "sse-starlette>=2.1.0,<4",
  "packaging>=22.0",
  "opentelemetry-api>=1.27.0,<2",
  "opentelemetry-sdk>=1.27.0,<2",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "opentelemetry-instrumentation-httpx>=0.48b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
  "opentelemetry-exporter-otlp>=1.27.0,<2",
  "python-json-logger>=2.0.7,<5",
  "structlog>=24.1.0,<26",
  "croniter>=2.0.1,<7",
  "wrapt>=1.14.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.2",
  "ruff>=0.6.9",
  "mypy>=1.13.0",
]

[tool.uvicorn]
app = "app.main:app"
host = "0.0.0.0"
port = 8000
reload = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["alembic*", "tests*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py311"
