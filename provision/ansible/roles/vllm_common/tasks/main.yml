---
# vLLM Common Installation Tasks
# Runs once before port-specific roles to set up the shared venv,
# system dependencies, GPU drivers, and Python packages.

- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600
  tags: [vllm_install]

- name: Install system dependencies
  apt:
    name:
      - build-essential
      - python3-pip
      - python3-venv
      - python3-dev
      - git
      - curl
      - wget
      - ca-certificates
      - ninja-build  # Required by torch/vLLM compile paths
      - psmisc  # For fuser
      - lsof    # For debugging open files
    state: present
  tags: [vllm_install]

- name: Remove stale deadsnakes PPA if left from failed deploy
  shell: rm -f /etc/apt/sources.list.d/*deadsnakes* 2>/dev/null; apt-get update -qq 2>/dev/null; true
  changed_when: false
  tags: [vllm_install]

- name: Check if GPU devices are present in container
  shell: "ls -la /dev/nvidia* 2>/dev/null || echo 'No NVIDIA devices'"
  register: gpu_devices_check
  changed_when: false
  failed_when: false
  tags: [vllm_install, vllm_gpu]

- name: Display GPU device status
  debug:
    msg: "{{ gpu_devices_check.stdout_lines }}"
  tags: [vllm_install, vllm_gpu]

- name: Check if NVIDIA drivers are installed
  shell: "nvidia-smi 2>&1 || echo 'NOT_INSTALLED'"
  register: nvidia_drivers_check
  changed_when: false
  failed_when: false
  tags: [vllm_install, vllm_gpu]

- name: Install NVIDIA drivers using install-nvidia-drivers.sh (on Proxmox host)
  shell: "bash /root/busibox/provision/pct/host/install-nvidia-drivers.sh {{ container_id }}"
  delegate_to: localhost
  become: false
  when: 
    - "'No NVIDIA devices' not in gpu_devices_check.stdout"
    - (nvidia_drivers_check.stdout is defined and 'NOT_INSTALLED' in nvidia_drivers_check.stdout) or (nvidia_drivers_check.stderr is defined and 'Driver/library version mismatch' in nvidia_drivers_check.stderr)
  register: driver_install_result
  changed_when: driver_install_result.rc == 0
  failed_when: driver_install_result.rc != 0
  tags: [vllm_install, vllm_gpu]

- name: Verify drivers after installation
  shell: "nvidia-smi 2>&1"
  register: nvidia_drivers_verify
  changed_when: false
  failed_when: "'Driver/library version mismatch' in nvidia_drivers_verify.stderr"
  tags: [vllm_install, vllm_gpu]

- name: Display nvidia-smi output
  debug:
    msg: "{{ nvidia_drivers_verify.stdout_lines }}"
  when: "'Driver/library version mismatch' not in nvidia_drivers_verify.stderr"
  tags: [vllm_install, vllm_gpu]

- name: Create vLLM system group
  group:
    name: "{{ vllm_user }}"
    system: yes
    state: present
  tags: [vllm_install]

- name: Create vLLM system user
  user:
    name: "{{ vllm_user }}"
    group: "{{ vllm_user }}"
    system: yes
    create_home: yes
    home: "{{ vllm_home }}"
    shell: /bin/false
    state: present
  tags: [vllm_install]

- name: Create vLLM directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ vllm_user }}"
    group: "{{ vllm_user }}"
    mode: '0755'
  loop:
    - "{{ vllm_install_dir }}"
    - "{{ vllm_home }}"
    - "{{ vllm_home }}/.cache"
    - "{{ vllm_home }}/.cache/vllm"
    - "{{ vllm_home }}/.cache/vllm/modelinfos"
    - "{{ vllm_cache_dir }}"
    - "{{ vllm_cache_dir }}/hub"
  tags: [vllm_install]

- name: Check existing vLLM version
  shell: "{{ vllm_venv_dir }}/bin/python -c 'import vllm; print(vllm.__version__)' 2>/dev/null || echo 'none'"
  register: existing_vllm_version
  changed_when: false
  failed_when: false
  tags: [vllm_install]

# Detect CUDA version from driver.
- name: Detect CUDA major version from nvidia-smi
  shell: "nvidia-smi 2>/dev/null | grep -oP 'CUDA Version: \\K[0-9]+' || echo '12'"
  register: cuda_major_version
  changed_when: false
  tags: [vllm_install, vllm_gpu]

# Only Blackwell (compute 10.x+) GPUs need cu130 wheels.
# Ampere (8.x) and Hopper (9.x) work fine with cu12x even with a CUDA 13 driver.
- name: Detect GPU compute capability
  shell: >
    nvidia-smi --query-gpu=compute_cap --format=csv,noheader 2>/dev/null | head -1 | cut -d. -f1 || echo '8'
  register: gpu_compute_major
  changed_when: false
  tags: [vllm_install, vllm_gpu]

# Check whether the venv has a working vllm + torch + CUDA stack.
# Only nuke if something is fundamentally broken, NOT just because
# cu130 is installed on an Ampere GPU (that works fine — CUDA is
# backward compatible).  The only real mismatch is cu12 on Blackwell
# (compute 10+), which would fail at runtime.
- name: Check if installed venv needs rebuild
  shell: |
    COMPUTE="{{ gpu_compute_major.stdout | default('8') }}"
    # 1. No venv at all? → rebuild
    if [ ! -f "{{ vllm_venv_dir }}/bin/python" ]; then
      echo "no_venv"
      exit 0
    fi
    # 2. No pip? (broken venv from uv) → rebuild
    if [ ! -f "{{ vllm_venv_dir }}/bin/pip" ] && [ ! -f "{{ vllm_venv_dir }}/bin/pip3" ]; then
      echo "no_pip"
      exit 0
    fi
    # 3. Can't import torch? → rebuild
    TORCH_CUDA=$({{ vllm_venv_dir }}/bin/python -c "import torch; print(torch.version.cuda or '')" 2>/dev/null || echo "")
    if [ -z "$TORCH_CUDA" ]; then
      echo "no_torch"
      exit 0
    fi
    TORCH_MAJOR=$(echo "$TORCH_CUDA" | cut -d. -f1)
    # 4. Blackwell (compute 10+) needs at least cu13. cu12 won't work.
    if [ "$COMPUTE" -ge 10 ] 2>/dev/null && [ "$TORCH_MAJOR" -lt 13 ] 2>/dev/null; then
      echo "mismatch_blackwell_needs_cu13"
      exit 0
    fi
    # 5. Can't import vllm? → rebuild
    {{ vllm_venv_dir }}/bin/python -c "import vllm" 2>/dev/null
    if [ $? -ne 0 ]; then
      echo "no_vllm"
      exit 0
    fi
    # Everything looks OK — don't touch it
    echo "ok"
  args:
    executable: /bin/bash
  register: venv_health_check
  changed_when: false
  failed_when: false
  tags: [vllm_install]

- name: Display venv health check
  debug:
    msg: "GPU compute={{ gpu_compute_major.stdout }}, venv health={{ venv_health_check.stdout }}"
  tags: [vllm_install]

# Only nuke the venv if it's genuinely broken or has a hard incompatibility.
- name: Recreate venv if broken or incompatible
  file:
    path: "{{ vllm_venv_dir }}"
    state: absent
  when: venv_health_check.stdout != 'ok'
  tags: [vllm_install]

- name: Create Python virtual environment
  command: "python3 -m venv {{ vllm_venv_dir }}"
  args:
    creates: "{{ vllm_venv_dir }}/bin/python"
  tags: [vllm_install]

- name: Upgrade pip in virtual environment
  pip:
    name: pip
    state: latest
    virtualenv: "{{ vllm_venv_dir }}"
  tags: [vllm_install]

- name: Install uv package manager
  pip:
    name: uv
    state: latest
    virtualenv: "{{ vllm_venv_dir }}"
  tags: [vllm_install]

- name: Check CUDA libraries and GPU device permissions
  shell: |
    echo "=== GPU devices ==="
    ls -la /dev/nvidia* 2>/dev/null || echo "No /dev/nvidia* devices"
    echo ""
    echo "=== nvidia-smi ==="
    nvidia-smi -L 2>/dev/null || echo "nvidia-smi failed"
  register: cuda_libs_check
  changed_when: false
  tags: [vllm_install, vllm_gpu]

- name: Display GPU status
  debug:
    msg: "{{ cuda_libs_check.stdout_lines }}"
  tags: [vllm_install, vllm_gpu]

- name: Set vLLM nightly wheel index based on GPU architecture
  set_fact:
    vllm_wheel_index: "{% if gpu_compute_major.stdout | default('8') | int >= 10 %}https://wheels.vllm.ai/nightly/cu130{% else %}https://wheels.vllm.ai/nightly{% endif %}"
  tags: [vllm_install]

- name: Display selected vLLM wheel index
  debug:
    msg: "CUDA {{ cuda_major_version.stdout }}, GPU compute {{ gpu_compute_major.stdout }}, wheel index: {{ vllm_wheel_index }}"
  tags: [vllm_install]

# vLLM nightly is required for the Qwen3-family MoE architectures
# (qwen3_5 / qwen3_6 / qwen3_moe) until they ship in a stable release.
# --index-strategy unsafe-best-match lets uv consider vllm from both the
# nightly index AND PyPI, picking the highest version with a matching
# platform wheel.
# --reinstall-package vllm forces uv to re-resolve and download the latest
# nightly even if a dev version is already installed (uv's cache otherwise
# considers the installed version as satisfying the bare "vllm" requirement).
# See: https://docs.vllm.ai/projects/recipes/en/latest/Qwen/Qwen3.5.html
- name: Install vLLM (nightly) with uv
  shell: |
    {{ vllm_venv_dir }}/bin/uv pip install -U vllm \
      --reinstall-package vllm \
      --torch-backend=auto \
      --prerelease=allow \
      --index-strategy unsafe-best-match \
      --extra-index-url {{ vllm_wheel_index }}
  args:
    executable: /bin/bash
  environment:
    VIRTUAL_ENV: "{{ vllm_venv_dir }}"
  tags: [vllm_install]

- name: Check vLLM version after install
  shell: "{{ vllm_venv_dir }}/bin/python -c 'import vllm; print(vllm.__version__)'"
  register: new_vllm_version
  changed_when: false
  tags: [vllm_install]

- name: Display vLLM upgrade result
  debug:
    msg: "vLLM {{ existing_vllm_version.stdout }} → {{ new_vllm_version.stdout }}"
  tags: [vllm_install]

# vllm._C is linked against libcudart.so.12 even in cu130 builds.
# Install the cu12 runtime as a compat shim so the .so can be found.
- name: Install nvidia-cuda-runtime-cu12 for libcudart.so.12 compat
  shell: |
    {{ vllm_venv_dir }}/bin/uv pip install nvidia-cuda-runtime-cu12
  args:
    executable: /bin/bash
  environment:
    VIRTUAL_ENV: "{{ vllm_venv_dir }}"
  tags: [vllm_install]

- name: Install additional Python packages
  shell: |
    {{ vllm_venv_dir }}/bin/uv pip install -U \
      huggingface-hub \
      'transformers>=5'
  args:
    executable: /bin/bash
  environment:
    VIRTUAL_ENV: "{{ vllm_venv_dir }}"
  tags: [vllm_install]

# torchaudio is dragged in by transformers (audio_utils import chain) and will
# crash vLLM on import if its CUDA build doesn't match torch. It is NOT needed
# for vision-language (Qwen VL) or text models — transformers handles the
# missing import gracefully. Always remove it; unconditional and idempotent.
- name: Remove torchaudio to prevent CUDA version mismatch with torch
  shell: |
    {{ vllm_venv_dir }}/bin/uv pip uninstall torchaudio 2>/dev/null || true
  args:
    executable: /bin/bash
  environment:
    VIRTUAL_ENV: "{{ vllm_venv_dir }}"
  changed_when: false
  tags: [vllm_install]

- name: Sync flashinfer-cubin to match flashinfer version
  shell: |
    FI_VER=$({{ vllm_venv_dir }}/bin/python -c "import importlib.metadata; print(importlib.metadata.version('flashinfer'))" 2>/dev/null || echo "")
    if [ -n "$FI_VER" ]; then
      CUBIN_VER=$({{ vllm_venv_dir }}/bin/python -c "import importlib.metadata; print(importlib.metadata.version('flashinfer-cubin'))" 2>/dev/null || echo "")
      if [ "$FI_VER" != "$CUBIN_VER" ]; then
        echo "flashinfer=$FI_VER vs flashinfer-cubin=$CUBIN_VER — upgrading cubin..."
        {{ vllm_venv_dir }}/bin/uv pip install "flashinfer-cubin==$FI_VER" --prerelease=allow 2>/dev/null || \
          echo "No matching flashinfer-cubin wheel for $FI_VER; FLASHINFER_DISABLE_VERSION_CHECK=1 will handle it at runtime"
      else
        echo "flashinfer and flashinfer-cubin both at $FI_VER — OK"
      fi
    else
      echo "flashinfer not installed, skipping cubin sync"
    fi
  args:
    executable: /bin/bash
  environment:
    VIRTUAL_ENV: "{{ vllm_venv_dir }}"
  register: flashinfer_sync
  changed_when: "'upgrading cubin' in flashinfer_sync.stdout"
  tags: [vllm_install]

- name: Display flashinfer sync result
  debug:
    msg: "{{ flashinfer_sync.stdout | trim }}"
  tags: [vllm_install]

- name: Fix flashinfer Python 3.11 compatibility (array.array[int] requires 3.12+)
  shell: |
    FD_FILE="{{ vllm_venv_dir }}/lib/python3.11/site-packages/flashinfer/comm/fd_exchange.py"
    if [ -f "$FD_FILE" ]; then
      if ! head -1 "$FD_FILE" | grep -q "from __future__ import annotations"; then
        sed -i '1s/^/from __future__ import annotations\n/' "$FD_FILE"
        echo "patched"
      else
        echo "already_patched"
      fi
    else
      echo "file_not_found"
    fi
  args:
    executable: /bin/bash
  register: flashinfer_compat_fix
  changed_when: "'patched' == flashinfer_compat_fix.stdout | trim"
  tags: [vllm_install]

- name: Display flashinfer compat fix result
  debug:
    msg: "flashinfer fd_exchange.py Python 3.11 fix: {{ flashinfer_compat_fix.stdout | trim }}"
  tags: [vllm_install]

- name: Verify vllm imports cleanly after torchaudio removal
  shell: |
    {{ vllm_venv_dir }}/bin/python -c "import vllm; print('vllm', vllm.__version__, 'OK')"
  register: vllm_import_check
  changed_when: false
  failed_when: vllm_import_check.rc != 0
  tags: [vllm_install]

- name: Display vllm import verification
  debug:
    msg: "{{ vllm_import_check.stdout | trim }}"
  tags: [vllm_install]

- name: Discover nvidia library paths in venv
  shell: |
    {{ vllm_venv_dir }}/bin/python -c "
    import glob, os
    site = os.path.join('{{ vllm_venv_dir }}', 'lib', 'python3.11', 'site-packages', 'nvidia')
    dirs = sorted(glob.glob(os.path.join(site, '*/lib')))
    print(':'.join(dirs))
    "
  register: nvidia_lib_dirs
  changed_when: false
  failed_when: false
  tags: [vllm_install]

- name: Set vllm_nvidia_lib_path fact
  set_fact:
    vllm_nvidia_lib_path: "{{ nvidia_lib_dirs.stdout | default('') }}"
  tags: [vllm_install]

- name: Display discovered nvidia lib paths
  debug:
    msg: "NVIDIA lib paths: {{ vllm_nvidia_lib_path }}"
  tags: [vllm_install]

- name: Test PyTorch CUDA availability
  shell: |
    unset CUDA_VISIBLE_DEVICES
    {{ vllm_venv_dir }}/bin/python -c "
    import torch
    print('PyTorch version:', torch.__version__)
    print('CUDA available:', torch.cuda.is_available())
    print('CUDA version:', torch.version.cuda)
    print('GPU count:', torch.cuda.device_count())
    if torch.cuda.is_available():
        for i in range(torch.cuda.device_count()):
            print(f'GPU {i}: {torch.cuda.get_device_name(i)}')
    else:
        print('CUDA not available')
    "
  args:
    executable: /bin/bash
  environment:
    LD_LIBRARY_PATH: "/usr/local/cuda/targets/x86_64-linux/lib:/usr/lib/x86_64-linux-gnu:/lib/x86_64-linux-gnu"
  register: pytorch_cuda_test
  changed_when: false
  tags: [vllm_install, vllm_gpu]

- name: Display PyTorch CUDA test results
  debug:
    msg: "{{ pytorch_cuda_test.stdout_lines }}"
  tags: [vllm_install, vllm_gpu]

- name: Verify PyTorch can detect CUDA
  shell: |
    {{ vllm_venv_dir }}/bin/python -c "import torch; assert torch.cuda.is_available(), 'CUDA not available'"
  environment:
    LD_LIBRARY_PATH: "/usr/local/cuda/targets/x86_64-linux/lib:/usr/lib/x86_64-linux-gnu:/lib/x86_64-linux-gnu"
  register: pytorch_cuda_verify
  changed_when: false
  failed_when: pytorch_cuda_verify.rc != 0
  tags: [vllm_install, vllm_gpu]

- name: Verify vLLM installation
  command: "{{ vllm_venv_dir }}/bin/python -c 'import vllm; print(vllm.__version__)'"
  register: vllm_version_check
  changed_when: false
  tags: [vllm_install]

- name: Display vLLM version
  debug:
    msg: "vLLM version: {{ vllm_version_check.stdout }}"
  tags: [vllm_install]

- name: Set vLLM directory ownership
  file:
    path: "{{ item }}"
    owner: "{{ vllm_user }}"
    group: "{{ vllm_user }}"
    recurse: yes
  loop:
    - "{{ vllm_install_dir }}"
    - "{{ vllm_home }}"
  tags: [vllm_install]
